<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with JPEG Background</title>
    <style>
        body {
            /* Replace 'your-image.jpg' with the actual filename or web URL of your JPEG */
            background-image: url('10.jpg'); 
            
            /* Prevents the image from repeating like a grid pattern */
            background-repeat: no-repeat; 
            
            /* Centers the background image vertically and horizontally */
            background-position: center; 
            
            /* Scales the image proportionally so it completely covers the screen */
            background-size: cover; 
            
            /* Keeps the background fixed in place so it doesn't scroll with the text */
            background-attachment: fixed; 
            
            /* Fallback color in case the image fails to load */
            background-color: #f0f0f0; 
            
            /* Simple text styling for contrast */
            color: #333333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Semi-transparent container to make text easily readable over the background */
        .content-box {
            background-color: rgba(255, 255, 255, 0.85); 
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            margin: 50px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
