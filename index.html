<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with JPEG Background</title>
    <style>
        body {
            /* Replace '10.jpg' with your actual JPEG file path or URL */
            background-image: url('your-background.jpg'); 
            
            /* Prevents the image from repeating like a grid */
            background-repeat: no-repeat; 
            
            /* Scales the image to completely cover the screen proportionally */
            background-size: cover; 
            
            /* Centers the background image vertically and horizontally */
            background-position: center; 
            
            /* Keeps the background fixed in place while scrolling */
            background-attachment: fixed; 
            
            /* Darkens the background slightly to ensure white text remains readable */
            background-color: rgba(0, 0, 0, 0.5); 
            background-blend-mode: overlay;

            /* Basic font styling */
            font-family: Arial, sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
</head>
<body>

    <div class="content-box">
        <h1>iuiplephesr</h1>
        <p>Osamah Miftah Meeloud Ahmed Published MetaTrader 5 signal XBTFX . The overlay and blur effects ensure that the text remains perfectly readable over any image style.</p>
    </div>

</body>
</html>
